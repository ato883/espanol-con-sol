<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lesson 1 - Saludos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f7fb;
    font-family:Arial,sans-serif;
}

header{
    background:#FFC107;
    padding:25px;
    text-align:center;
}

.word{
    background:white;
    margin:10px 0;
    padding:15px;
    border-radius:12px;
    box-shadow:0 3px 8px rgba(0,0,0,.08);
}

span{
    float:right;
    color:#198754;
    font-weight:bold;
}
</style>

</head>

<body>

<header>
<h2>👋 Lesson 1 - Saludos</h2>
<p>التحيات باللغة الإسبانية</p>
</header>

<div class="container mt-4">

<div class="word">
Hola
<span>مرحباً</span>
</div>

<div class="word">
Buenos días
<span>صباح الخير</span>
</div>

<div class="word">
Buenas tardes
<span>مساء الخير</span>
</div>

<div class="word">
Buenas noches
<span>تصبح على خير</span>
</div>

<div class="word">
Gracias
<span>شكراً</span>
</div>

<div class="word">
De nada
<span>العفو</span>
</div>

<hr>

<h4>📝 Quiz</h4>

<p><b>¿Cómo se dice "شكراً"؟</b></p>

<button class="btn btn-outline-primary m-2" onclick="check(false)">Hola</button>

<button class="btn btn-outline-primary m-2" onclick="check(true)">Gracias</button>

<button class="btn btn-outline-primary m-2" onclick="check(false)">Adiós</button>

<p id="result" class="mt-3 fw-bold"></p>

<script>
function check(correct){
    const result=document.getElementById("result");

    if(correct){
        result.innerHTML="✅ ¡Correcto!";
        result.style.color="green";
    }else{
        result.innerHTML="❌ Inténtalo otra vez";
        result.style.color="red";
    }
}
</script>

</div>

</body>
